services:
  - type: web
    name: task4-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task4-db
          property: connectionString

databases:
  - name: task4-db
    plan: free
    databaseName: user_admin_db
    user: appuser
